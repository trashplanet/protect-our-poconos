name: Check site content and public build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify shared header and footer
        run: python3 scripts/render-partials.py --check
      - name: Verify shared project content
        run: python3 scripts/sync-projects.py --check
      - name: Test content, clean URLs, sitemap and metadata
        run: python3 -m unittest discover -s tests
