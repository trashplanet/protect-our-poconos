name: Check project content consistency
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify shared project content
        run: python3 scripts/sync-projects.py --check
      - name: Test synchronization safeguards
        run: python3 -m unittest discover -s tests
