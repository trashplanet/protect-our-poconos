name: Deploy static site to GitHub Pages

# Publish repository edits automatically; manual runs remain available.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so build-site.py can date pages from git
      - name: Render shared header and footer
        run: python3 scripts/render-partials.py
      - name: Synchronize project content
        run: python3 scripts/sync-projects.py
      - uses: actions/configure-pages@v5
      - name: Build clean URLs and search metadata
        run: python3 scripts/build-site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
