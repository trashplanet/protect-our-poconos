name: Deploy static site to GitHub Pages

# Run manually when the draft content and destination links are ready.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Synchronize project content
        run: python3 scripts/sync-projects.py
      - uses: actions/configure-pages@v5
      - name: Stage public files only
        run: |
          mkdir _site
          cp index.html projects.html news.html issues.html take-action.html .nojekyll _site/
          cp -R assets _site/assets
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
